<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Список слов</title>
  <style>
    body { 
      font-family: Arial, sans-serif;
      margin: 0; 
      padding: 15px;
      width: 300px;
      background-color: #f4f4f4;
    }
    textarea {
      width: 100%;
      height: 200px;
      resize: vertical;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover {
      background: #0d47a1;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: green;
      text-align: center;
      height: 15px;
    }
  </style>
</head>
<body>
  <textarea id="wordList" placeholder="Слово1&#10;Слово2&#10;Слово3"></textarea>
  <button id="saveBtn">Сохранить</button>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
