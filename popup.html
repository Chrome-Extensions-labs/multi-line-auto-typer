<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>List Inserter Settings</title>
  <link rel="stylesheet" href="styles/popup.css" />
</head>
<body>
  <button id="themeToggle" type="button" aria-label="Switch to light theme">☀️</button>

  <label class="fieldLabel" for="profileSelect">Active profile</label>
  <select id="profileSelect" aria-label="Active profile"></select>
  <div class="profileActions">
    <button id="newProfile" type="button">New</button>
    <button id="duplicateProfile" type="button">Duplicate</button>
    <button id="deleteProfile" type="button">Delete</button>
  </div>

  <label class="fieldLabel" for="profileName">Profile name</label>
  <input id="profileName" type="text" maxlength="50" />

  <label class="fieldLabel" for="wordList">List entries (one per line)</label>
  <textarea id="wordList" placeholder="Item 1&#10;Item 2&#10;Item 3"></textarea>

  <div class="row">
    <label class="fieldLabel" for="delayMs">Delay between entries (ms)</label>
    <input id="delayMs" type="number" min="0" max="5000" step="1" value="40" />
  </div>

  <div class="row">
    <label class="fieldLabel" for="enterDelayMs">Wait before Enter (ms)</label>
    <input id="enterDelayMs" type="number" min="0" max="5000" step="1" value="100" />
  </div>

  <label class="checkboxRow" for="skipDuplicates">
    <input id="skipDuplicates" type="checkbox" />
    Skip duplicate lines
  </label>

  <label class="checkboxRow" for="pressEnter">
    <input id="pressEnter" type="checkbox" />
    Press Enter after each entry
  </label>
  <div class="hint">With Enter off, entries are inserted together as lines. Chrome may show a debugging notice while sending real Enter presses.</div>

  <button id="saveBtn" type="button">Save changes</button>
  <div id="wordCount" aria-live="polite"></div>
  <div id="status" aria-live="polite"></div>

  <div class="oss-bar">
    <span class="oss-bar__text">Open-source project:</span>
    <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/multi-line-auto-typer" target="_blank" rel="noopener noreferrer">
      GitHub
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>

  <script type="module" src="src/popup/app.js"></script>
</body>
</html>
